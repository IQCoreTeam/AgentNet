[package]
name = "agentnet-desktop"
version = "0.0.1"
description = "AgentNet desktop shell: spawns the localhost server and wraps the SPA in a native window"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[[bin]]
name = "agentnet-desktop"
path = "src/main.rs"
